<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receipt | First State Bank</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root{
      --ink:#1B1712;--ink-soft:#2A2115;
      --gold:#B8862E;--gold-light:#D9AE5F;--gold-pale:#F1E4C6;
      --cream:#FBF7EE;--cream-2:#F2EAD6;--paper:#FFFFFF;
      --text:#2B2419;--muted:#77695A;--border:#E6DCC2;
      --green:#2F7A4A;--green-pale:#E4F1E8;
      --red:#B23A2E;--red-pale:#F7E4E1;
      --radius:2px;
      --shadow:0 18px 40px -22px rgba(27,23,18,0.35);
    }
    *{box-sizing:border-box;}
    html{-webkit-text-size-adjust:100%;}
    body{margin:0;background:var(--cream-2);color:var(--text);font-family:"Inter",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding:30px 16px 60px;}
    h1,h2,h3,h4{font-family:"Fraunces",Georgia,serif;font-weight:600;color:var(--ink);margin:0 0 .5em;}
    p{margin:0 0 1em;color:var(--muted);}
    a{color:inherit;text-decoration:none;}

    .wrap{max-width:720px;margin:0 auto;}

    .actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
    .actions .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;font-weight:500;}
    .actions .back:hover{color:var(--gold);}
    .actions .btns{display:flex;gap:10px;flex-wrap:wrap;}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:transform .2s, background .2s, border-color .2s, color .2s;min-height:44px;font-family:inherit;}
    .btn:hover{transform:translateY(-2px);}
    .btn-gold{background:var(--gold);color:var(--ink);border-color:var(--gold);}
    .btn-gold:hover{background:var(--gold-light);border-color:var(--gold-light);}
    .btn-line{background:transparent;border-color:var(--border);color:var(--ink);}
    .btn-line:hover{border-color:var(--gold);color:var(--gold);}

    .receipt{background:var(--paper);border-radius:4px;overflow:hidden;box-shadow:var(--shadow);position:relative;}
    .receipt::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--gold),var(--gold-light),var(--gold));}

    .r-head{padding:36px 44px 26px;text-align:center;border-bottom:1px dashed var(--border);position:relative;}
    .r-head .logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:12px;}
    .r-head .brand-name{font-family:"Fraunces",serif;font-size:22px;color:var(--ink);font-weight:600;letter-spacing:-0.01em;}
    .r-head .brand-sub{font-size:10px;letter-spacing:.14em;color:var(--gold);}
    .r-head h2{font-size:16px;color:var(--muted);font-family:"Inter",sans-serif;font-weight:500;letter-spacing:.14em;text-transform:uppercase;margin:14px 0 6px;}
    .r-head .amt{font-family:"Fraunces",serif;font-size:clamp(32px,5vw,42px);color:var(--ink);line-height:1;margin-bottom:10px;}
    .r-head .amt.out{color:var(--red);}
    .r-head .amt.in{color:var(--green);}
    .r-head .status{display:inline-block;font-size:12px;font-weight:600;padding:5px 14px;border-radius:20px;letter-spacing:.04em;}
    .r-head .status.completed{background:var(--green-pale);color:var(--green);}
    .r-head .status.pending{background:#FBF0D9;color:#8A6A20;}
    .r-head .status.failed{background:var(--red-pale);color:var(--red);}

    .r-body{padding:32px 44px 8px;}
    .r-row{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--border);align-items:start;}
    .r-row:last-child{border-bottom:0;}
    .r-row .lbl{font-size:12.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-weight:600;padding-top:2px;}
    .r-row .val{font-size:14.5px;color:var(--ink);font-weight:500;word-break:break-word;}
    .r-row .val.mono{font-family:monospace;letter-spacing:.02em;}
    .r-row .val.strong{font-weight:600;}
    .r-row .val .sub-note{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px;}

    .r-total{background:var(--cream);margin:8px -44px 0;padding:22px 44px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
    .r-total .lbl{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;}
    .r-total .val{font-family:"Fraunces",serif;font-size:26px;color:var(--ink);font-weight:600;}
    .r-total .val.out{color:var(--red);}
    .r-total .val.in{color:var(--green);}

    .r-foot{padding:26px 44px 34px;border-top:1px dashed var(--border);text-align:center;}
    .r-foot .thanks{font-family:"Fraunces",serif;font-style:italic;font-size:17px;color:var(--gold);margin-bottom:8px;}
    .r-foot p{font-size:13px;color:var(--muted);margin:0 0 6px;}
    .r-foot .ref-line{font-family:monospace;font-size:12.5px;color:var(--muted);letter-spacing:.06em;margin-top:14px;}
    .r-foot .contacts{margin-top:20px;padding-top:20px;border-top:1px solid var(--border);display:flex;justify-content:center;gap:24px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);}
    .r-foot .contacts strong{color:var(--ink);font-weight:600;display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px;}

    .watermark{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);font-family:"Fraunces",serif;font-size:88px;font-weight:700;color:rgba(184,134,46,.09);letter-spacing:.04em;pointer-events:none;z-index:0;white-space:nowrap;}
    .r-head, .r-body, .r-foot, .r-total{position:relative;z-index:1;}

    .state{background:var(--paper);border-radius:4px;padding:60px 34px;text-align:center;box-shadow:var(--shadow);}
    .state .ico{width:64px;height:64px;border-radius:50%;background:var(--cream-2);color:var(--muted);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
    .state .ico.err{background:var(--red-pale);color:var(--red);}
    .state h3{font-size:20px;margin-bottom:6px;}
    .state p{font-size:14.5px;margin:0 0 20px;}

    .loading{background:var(--paper);border-radius:4px;padding:80px 34px;text-align:center;box-shadow:var(--shadow);}
    .loading .spinner{width:44px;height:44px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--gold);margin:0 auto 20px;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    @media (max-width:600px){
      body{padding:20px 10px 40px;}
      .r-head{padding:28px 22px 22px;}
      .r-body{padding:24px 22px 6px;}
      .r-total{margin:8px -22px 0;padding:18px 22px;}
      .r-foot{padding:22px 22px 26px;}
      .r-row{grid-template-columns:1fr;gap:4px;padding:12px 0;}
      .r-row .lbl{padding-top:0;}
      .watermark{font-size:60px;}
      .actions .btns{width:100%;}
      .actions .btns .btn{flex:1;}
    }
    @media print{
      body{background:#fff;padding:0;}
      .actions{display:none;}
      .receipt{box-shadow:none;}
      .watermark{color:rgba(184,134,46,.08);}
    }
    @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<div class="wrap">
  <div class="actions">
    <a class="back" href="transactions.html">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Transactions
    </a>
    <div class="btns">
      <button class="btn btn-line" id="shareBtn">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><circle cx="15" cy="5" r="2.2" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="5" cy="10" r="2.2" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="15" cy="15" r="2.2" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M7 9l6-3M7 11l6 3" stroke="currentColor" stroke-width="1.6"/></svg>
        Copy Link
      </button>
      <button class="btn btn-gold" id="printBtn">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M6 8V3h8v5" stroke="currentColor" stroke-width="1.6" fill="none"/><rect x="3" y="8" width="14" height="7" rx="1.4" stroke="currentColor" stroke-width="1.6" fill="none"/><rect x="6" y="12" width="8" height="5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
        Print / Save PDF
      </button>
    </div>
  </div>

  <div id="receiptWrap">
    <div class="loading">
      <div class="spinner"></div>
      <p style="margin:0;font-size:14px;">Loading receipt…</p>
    </div>
  </div>
</div>

<script type="module">
import { app, auth, db, ADMIN_EMAIL } from "./firebase-config.js";
import { onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

var params = new URLSearchParams(window.location.search);
var receiptId = params.get("id");

function fmtUSD(n){
  var sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(n).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDateFull(s){
  if(!s) return "—";
  var d = s.toDate ? s.toDate() : new Date(s);
  if(isNaN(d)) return "—";
  var mo = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var hh = String(d.getHours()).padStart(2,"0");
  var mm = String(d.getMinutes()).padStart(2,"0");
  return mo[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear() + " at " + hh + ":" + mm;
}
function maskAcct(a){
  if(!a) return "—";
  var digits = String(a).replace(/\s+/g,"");
  return "•••• •••• " + digits.slice(-4);
}
function showToast(msg){
  var t = document.createElement("div");
  t.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1B1712;color:#fff;padding:12px 22px;border-radius:40px;font-size:13.5px;box-shadow:0 18px 40px -22px rgba(27,23,18,.35);z-index:210;";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2200);
}

function renderNotFound(msg){
  document.getElementById("receiptWrap").innerHTML =
    '<div class="state">'+
      '<div class="ico err"><svg width="28" height="28" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M10 6v6M10 14h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>'+
      '<h3>Receipt not found</h3>'+
      '<p>'+msg+'</p>'+
      '<a class="btn btn-gold" href="transactions.html">Back to transactions</a>'+
    '</div>';
}

function renderReceipt(tx, senderName, senderAccount){
  var amountClass = tx.amount < 0 ? "out" : "in";
  var watermark = (tx.type || "transaction").toUpperCase();

  var recipientBlock = "";
  if(tx.type === "transfer"){
    recipientBlock =
      '<div class="r-row"><div class="lbl">Recipient</div><div class="val strong">'+(tx.recipientName || "—")+
        (tx.recipientBank ? '<span class="sub-note">'+tx.recipientBank+'</span>' : '')+
      '</div></div>'+
      '<div class="r-row"><div class="lbl">Recipient Account</div><div class="val mono">'+maskAcct(tx.recipientAccount)+
        (tx.routing ? '<span class="sub-note">Routing: '+tx.routing+'</span>' : '')+
      '</div></div>';
  } else if(tx.type === "withdrawal"){
    recipientBlock =
      '<div class="r-row"><div class="lbl">Destination Bank</div><div class="val strong">'+(tx.bank || "—")+'</div></div>'+
      '<div class="r-row"><div class="lbl">Destination Account</div><div class="val mono">'+maskAcct(tx.accountNumber)+
        (tx.accountHolder ? '<span class="sub-note">Holder: '+tx.accountHolder+'</span>' : '')+
      '</div></div>';
  } else if(tx.type === "deposit"){
    recipientBlock =
      '<div class="r-row"><div class="lbl">Source</div><div class="val strong">'+(tx.source || tx.from || "—")+'</div></div>';
  }

  document.getElementById("receiptWrap").innerHTML =
    '<div class="receipt">'+
      '<div class="watermark">'+watermark+'</div>'+

      '<div class="r-head">'+
        '<div class="logo">'+
          '<svg width="40" height="40" viewBox="0 0 48 48" fill="none" aria-hidden="true">'+
            '<path d="M24 3 L43 10 V22 C43 33 35.5 41.5 24 45 C12.5 41.5 5 33 5 22 V10 Z" fill="#1B1712" stroke="#D9AE5F" stroke-width="1.5"/>'+
            '<path d="M16 18h16M16 24h12M16 30h9" stroke="#D9AE5F" stroke-width="2" stroke-linecap="round"/>'+
          '</svg>'+
          '<div style="text-align:left;">'+
            '<div class="brand-name">First State Bank</div>'+
            '<div class="brand-sub">SINCE 2011</div>'+
          '</div>'+
        '</div>'+
        '<h2>Transaction Receipt</h2>'+
        '<div class="amt '+amountClass+'">'+fmtUSD(tx.amount)+'</div>'+
        '<span class="status '+(tx.status || "completed")+'">'+((tx.status || "completed").charAt(0).toUpperCase() + (tx.status || "completed").slice(1))+'</span>'+
      '</div>'+

      '<div class="r-body">'+
        '<div class="r-row"><div class="lbl">Reference No.</div><div class="val mono strong">'+(tx.reference || receiptId)+'</div></div>'+
        '<div class="r-row"><div class="lbl">Date &amp; Time</div><div class="val">'+fmtDateFull(tx.createdAt)+'</div></div>'+
        '<div class="r-row"><div class="lbl">Transaction Type</div><div class="val strong">'+((tx.type || "transaction").charAt(0).toUpperCase() + (tx.type || "transaction").slice(1))+'</div></div>'+
        '<div class="r-row"><div class="lbl">Sender</div><div class="val strong">'+(senderName || "—")+
          (senderAccount ? '<span class="sub-note">Account: '+maskAcct(senderAccount)+'</span>' : '')+'</div></div>'+
        recipientBlock +
        (tx.note ? '<div class="r-row"><div class="lbl">Note</div><div class="val">'+tx.note+'</div></div>' : '')+
        '<div class="r-row"><div class="lbl">Payment Code</div><div class="val mono">'+(tx.pinUsed || "••••")+'</div></div>'+
      '</div>'+

      '<div class="r-total">'+
        '<span class="lbl">Total Amount</span>'+
        '<span class="val '+amountClass+'">'+fmtUSD(tx.amount)+'</span>'+
      '</div>'+

      '<div class="r-foot">'+
        '<div class="thanks">Thank you for banking with us.</div>'+
        '<p>This receipt is an official confirmation of the above transaction.</p>'+
        '<p>Please keep it for your records.</p>'+
        '<div class="ref-line">Reference: '+(tx.reference || receiptId)+'</div>'+
        '<div class="contacts">'+
          '<div><strong>Email</strong>support@firststatebank.uk</div>'+
          '<div><strong>Phone</strong>+44 (0) 7344 658784</div>'+
          '<div><strong>Address</strong>Cedar Falls, IA 50613</div>'+
        '</div>'+
      '</div>'+
    '</div>';
}

/* ---------- LOAD ---------- */
async function loadReceipt(user){
  if(!receiptId){
    renderNotFound("No receipt reference was provided.");
    return;
  }
  try {
    var snap = await getDoc(doc(db, "transactions", receiptId));
    if(!snap.exists()){
      renderNotFound("We couldn't locate a transaction with that reference.");
      return;
    }
    var tx = snap.data();

    /* Access control: owner or admin */
    var isAdmin = user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
    if(tx.uid !== user.uid && !isAdmin){
      renderNotFound("You don't have permission to view this receipt.");
      return;
    }

    /* Look up sender */
    var senderName = "—", senderAccount = "—";
    try {
      var uSnap = await getDoc(doc(db, "users", tx.uid));
      if(uSnap.exists()){
        var u = uSnap.data();
        senderName = u.fullName || "—";
        senderAccount = u.accountNumber || "";
      }
    } catch(e){}

    renderReceipt(tx, senderName, senderAccount);

  } catch(err){
    console.error(err);
    renderNotFound("Something went wrong loading this receipt.");
  }
}

/* ---------- BUTTONS ---------- */
document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
document.getElementById("shareBtn").addEventListener("click", function(){
  var url = window.location.href;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){ showToast("Receipt link copied"); });
  } else { showToast("Copy not supported"); }
});

/* ---------- AUTH ---------- */
onAuthStateChanged(auth, async function(user){
  if(!user){
    document.getElementById("receiptWrap").innerHTML =
      '<div class="state">'+
        '<div class="ico"><svg width="28" height="28" viewBox="0 0 20 20" fill="none"><rect x="4" y="9" width="12" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M6.5 9V6.5a3.5 3.5 0 017 0V9" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></div>'+
        '<h3>Please sign in</h3>'+
        '<p>You need to be signed in to view this receipt.</p>'+
        '<a class="btn btn-gold" href="login.html">Sign In</a>'+
      '</div>';
    return;
  }
  await loadReceipt(user);
});
</script>
</body>
</html>
